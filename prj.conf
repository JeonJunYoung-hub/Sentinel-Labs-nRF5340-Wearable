CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PWM=y

# SHT40 via mainline Zephyr sensor driver (no external lib needed)
CONFIG_SENSOR=y
CONFIG_SHT4X=y

# BMV080 Bosch lib is built for m33f (hard-float) -> match the float ABI, else link fails
CONFIG_FPU=y

# Bosch particle algorithm (lib_postProcessor) is stack-hungry; serve_interrupt
# runs it on the main stack. 8K overflowed -> 16K. (RAM is 448K, plenty.)
CONFIG_MAIN_STACK_SIZE=16384

# Minute records in internal flash (storage_partition, 160K)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Device id ("SL" + 6 hex of the factory id) for the frame and advertising name
CONFIG_HWINFO=y

# BLE peripheral. The controller runs on the network core - see Kconfig.sysbuild.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="SNTL"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=2048

# App asks for MTU 247 after connecting; smaller still works, just slower.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2
